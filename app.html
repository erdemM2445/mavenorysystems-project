  --card: rgba(255,255,255,.088);
  --card-2: rgba(255,255,255,.055);
  --line: rgba(255,255,255,.13);
  --text: #f7f4ef;
  --muted: rgba(247,244,239,.68);
  --soft: rgba(247,244,239,.44);
  --brand: #c69c6d;

  --green: #5eead4;
  --yellow: #facc15;
  --red: #fb7185;
  --blue: #93c5fd;
  --purple: #c4b5fd;

  --radius: 24px;
  --radius-sm: 15px;
  --sidebar: 284px;
}

[data-theme="light"] {
  --bg: #f6f1ea;
  --bg-2: #fffaf3;
  --panel: rgba(255,255,255,.72);
  --panel-strong: rgba(255,255,255,.92);
  --card: rgba(255,255,255,.86);
  --card-2: rgba(255,255,255,.7);
  --line: rgba(26, 32, 44, .13);
  --text: #111827;
  --muted: rgba(17,24,39,.68);
  --soft: rgba(17,24,39,.47);
  --shadow: 0 22px 80px rgba(92,64,36,.17);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {

  background:

  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: -.01em;
}

button, input, select, textarea { font: inherit; }

a { color: inherit; }

.auth-shell {

  display: grid;
  place-items: center;
  padding: 28px;

.auth-card {

  grid-template-columns: 1.02fr .98fr;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 34px;
  background: linear-gradient(145deg, var(--panel-strong), var(--panel));
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.auth-hero {

}

.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 850;
  letter-spacing: -.04em;
}

.logo-mark {
  width: 38px;
  height: 38px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: #111;
  background: linear-gradient(135deg, var(--brand-2), var(--brand));
  font-weight: 950;
  box-shadow: 0 10px 30px rgba(198,156,109,.22);
}

.auth-hero h1 {
  font-size: clamp(2.2rem, 6vw, 4.8rem);
  line-height: .94;
  margin: 74px 0 20px;
  letter-spacing: -.08em;
}

.auth-hero p {
  color: var(--muted);
  line-height: 1.7;
  font-size: 1.04rem;
  max-width: 520px;
}

.auth-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
  margin-top: 32px;
}

.auth-list div {
  padding: 14px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.06);
  border-radius: 18px;
  color: var(--muted);
}

.auth-form {
  padding: 46px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.auth-form h2 { margin: 0 0 8px; font-size: 1.8rem; letter-spacing: -.045em; }
.auth-form p { margin: 0 0 24px; color: var(--muted); line-height: 1.55; }

.form-grid {
  display: grid;
  gap: 14px;
}

.field {
  display: grid;
  gap: 7px;
}
.field label {
  font-size: .8rem;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--soft);
  font-weight: 750;
}
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.075);
  color: var(--text);
  border-radius: 14px;
  padding: 12px 13px;
  outline: none;
  transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
}
.textarea { min-height: 130px; resize: vertical; line-height: 1.5; }
.input:focus, .select:focus, .textarea:focus {
  border-color: rgba(198,156,109,.7);
  box-shadow: 0 0 0 4px rgba(198,156,109,.12);
}
.select option { background: #11182c; color: #fff; }

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.btn {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.08);
  color: var(--text);
  border-radius: 14px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: 780;
  transition: transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.13); }
.btn:active { transform: translateY(0); }
.btn-primary {
  background: linear-gradient(135deg, var(--brand-2), var(--brand));
  color: #1b130a;
  border-color: transparent;
}
.btn-danger { color: var(--red); border-color: rgba(251,113,133,.35); }
.btn-small { padding: 8px 10px; border-radius: 11px; font-size: .86rem; }
.btn-ghost { background: transparent; }
.btn:disabled { opacity: .48; cursor: not-allowed; transform: none; }

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
}

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 22px;
  border-right: 1px solid var(--line);
  background: rgba(5, 9, 20, .46);
  backdrop-filter: blur(18px);
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: auto;
}

.workspace-card {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: var(--card);
}
.workspace-card strong { display: block; font-size: .98rem; margin-top: 10px; }
.workspace-card span { color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; }

.nav {
  display: grid;
  gap: 7px;
}
.nav button {
  width: 100%;
  text-align: left;
  padding: 12px 13px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-weight: 720;
}
.nav button:hover { background: rgba(255,255,255,.07); color: var(--text); }
.nav button.active {
  color: var(--text);
  background: linear-gradient(135deg, rgba(198,156,109,.22), rgba(255,255,255,.06));
  border-color: rgba(198,156,109,.28);
}
.nav small {
  display: block;
  margin-top: 3px;
  color: var(--soft);
  font-weight: 560;
}

.sidebar-footer {
  margin-top: auto;
  color: var(--soft);
  font-size: .82rem;
  line-height: 1.55;
}

.main {
  min-width: 0;
  padding: 28px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.mobile-menu { display: none; }
.page-title h1 {
  margin: 0;
  font-size: clamp(1.8rem, 3vw, 3.2rem);
  letter-spacing: -.07em;
}
.page-title p { margin: 6px 0 0; color: var(--muted); line-height: 1.55; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.07);
  border-radius: 999px;
  padding: 7px 10px;
  color: var(--muted);
  font-size: .85rem;
  white-space: nowrap;
}

.grid {
  display: grid;
  gap: 16px;
}
.grid-2 { grid-template-columns: repeat(2, minmax(0,1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
.grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }

.card {
  border: 1px solid var(--line);
  background: linear-gradient(145deg, var(--card), var(--card-2));
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  overflow: hidden;
}

.card h2, .card h3 {
  margin: 0 0 10px;
  letter-spacing: -.045em;
}
.card p { color: var(--muted); line-height: 1.55; }

.kpi {
  min-height: 135px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.kpi .label { color: var(--muted); font-weight: 720; font-size: .9rem; }
.kpi .value { font-size: clamp(1.8rem, 3.2vw, 2.8rem); font-weight: 900; letter-spacing: -.07em; }
.kpi .sub { color: var(--soft); font-size: .86rem; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 5px 9px;
  font-size: .78rem;
  font-weight: 850;
  border: 1px solid var(--line);
  white-space: nowrap;
}
.badge.Keep, .badge.OK, .badge.Active { color: var(--green); background: rgba(94,234,212,.10); border-color: rgba(94,234,212,.25); }
.badge.Restock, .badge.Watch, .badge.RaisePrice { color: var(--yellow); background: rgba(250,204,21,.10); border-color: rgba(250,204,21,.25); }
.badge.Stop, .badge.OrderNow, .badge.Cancelled { color: var(--red); background: rgba(251,113,133,.10); border-color: rgba(251,113,133,.25); }
.badge.TestMore, .badge.PastDue { color: var(--blue); background: rgba(147,197,253,.10); border-color: rgba(147,197,253,.25); }
.badge.Full { color: var(--brand-2); background: rgba(198,156,109,.12); border-color: rgba(198,156,109,.35); }

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 18px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}
th, td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: middle;
  font-size: .92rem;
}
th {

  text-transform: uppercase;
  letter-spacing: .07em;
  font-size: .73rem;
  background: rgba(255,255,255,.055);
  position: sticky;
  top: 0;
  z-index: 1;

td { color: var(--muted); }
tr:hover td { background: rgba(255,255,255,.035); }
td strong { color: var(--text); }

.inline-input {
  width: 96px;
  min-width: 78px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.06);
  color: var(--text);
  border-radius: 10px;
  padding: 8px;
}
.inline-input.wide { width: 170px; }
.inline-input.xwide { width: 230px; }

.action-strip {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.search {
  min-width: min(100%, 360px);
}

.progress-list {
  display: grid;
  gap: 14px;
}
.progress-item {
  display: grid;
  grid-template-columns: minmax(130px, .8fr) minmax(0, 2fr) auto;
  gap: 12px;
  align-items: center;
}
.progress-track {
  height: 11px;
  border-radius: 99px;
  overflow: hidden;
  background: rgba(255,255,255,.09);
}
.progress-bar {
  height: 100%;
  width: var(--w, 0%);
  border-radius: inherit;
  background: linear-gradient(90deg, var(--brand), var(--brand-2));
}
.progress-item span { color: var(--muted); font-size: .9rem; }
.progress-item strong { font-size: .88rem; }

.insight {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 15px;
  background: rgba(255,255,255,.055);

.insight-title { display: flex; gap: 8px; align-items: center; font-weight: 850; margin-bottom: 6px; }
.insight p { margin: 0; color: var(--muted); font-size: .93rem; }

.report-box {
  border: 1px solid rgba(198,156,109,.32);
  border-radius: 22px;
  padding: 18px;
  background: linear-gradient(135deg, rgba(198,156,109,.15), rgba(255,255,255,.045));
  color: var(--text);
  line-height: 1.7;
}

.toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 50;
  max-width: 380px;
  border: 1px solid var(--line);
  background: var(--panel-strong);
  color: var(--text);
  box-shadow: var(--shadow);
  padding: 13px 15px;
  border-radius: 17px;
  opacity: 0;
  transform: translateY(14px);
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

.empty {
  text-align: center;
  padding: 38px 20px;
  color: var(--muted);
}

.hr { height: 1px; background: var(--line); margin: 18px 0; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hidden { display: none !important; }
.mt { margin-top: 16px; }
.mb { margin-bottom: 16px; }

@media (max-width: 1100px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }

@media (max-width: 860px) {
  .auth-card { grid-template-columns: 1fr; }
  .auth-hero h1 { margin-top: 34px; }
  .auth-list { grid-template-columns: 1fr; }
  .app-shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(86vw, 330px);
    z-index: 30;
    transform: translateX(-105%);
    transition: transform .22s ease;

  body.sidebar-open .sidebar { transform: translateX(0); }
  .main { padding: 18px; }
  .mobile-menu { display: inline-flex; }
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .topbar { align-items: flex-start; }
  .topbar .btn-row { justify-content: flex-end; }
  .progress-item { grid-template-columns: 1fr; }
}

@media (max-width: 560px) {
  .auth-shell { padding: 12px; }
  .auth-hero, .auth-form { padding: 26px; }
  .topbar { flex-direction: column; }
  .btn-row { width: 100%; }
  .btn-row .btn { flex: 1; }
}

  </style>
</head>

  function salesForSku(sku) {
    return state.sales.filter((s) => String(s.sku).trim() === String(sku).trim());

  function aggregateSales(sku) {
    const rows = salesForSku(sku);
    return {
      units: sum(rows, "unitsSold"),
      revenue: sum(rows, "revenue"),
      refunds: sum(rows, "refunds"),
      adSpend: sum(rows, "adSpend")

  function feePerUnit(price, settings = state.settings) {
    return num(settings.listingFee) + price * num(settings.transactionFee) + price * num(settings.paymentRate) + num(settings.paymentFixedFee);
  }

  function variableCost(product) {
    return num(product.materialCost) + num(product.packagingCost) + num(product.shippingCost);
  }

  function reorderTrigger(product, avgDailySales) {
    const z = num(product.serviceLevelZ) > 0 ? num(product.serviceLevelZ) : num(state.settings.defaultServiceZ);
    const lt = Math.max(0, num(product.leadTimeDays));
    return avgDailySales * lt + z * num(product.demandStdDevDay) * Math.sqrt(lt);
  }

  function calculateAnalysis() {
    return state.products.map((p, index) => {
      const s = aggregateSales(p.sku);
      const units = s.units;
      const price = num(p.sellingPrice);
      const revenue = s.revenue > 0 ? s.revenue : price * units;
      const fee = feePerUnit(price);
      const cost = variableCost(p);
      const fallbackRefunds = num(p.returnRate) * revenue;
      const actualRefunds = s.refunds > 0 ? s.refunds : fallbackRefunds;
      const ad = s.adSpend > 0 ? s.adSpend : num(p.adSpendUnit) * units;
      const netProfitTotal = revenue - (fee * units) - (cost * units) - ad - actualRefunds;
      const netProfitUnit = units > 0 ? netProfitTotal / units : 0;
      const margin = revenue > 0 ? netProfitTotal / revenue : 0;
      const laborHours = (num(p.laborMinutes) * units) / 60;
      const profitHour = laborHours > 0 ? netProfitTotal / laborHours : 0;
      const avgDailySales = units / 30;
      const trigger = reorderTrigger(p, avgDailySales);

      let decision = "Keep";
      if (units < num(state.settings.lowSalesThreshold)) decision = "Test More";
      else if (num(p.returnRate) > num(state.settings.highReturnThreshold)) decision = "Test More";
      else if (profitHour < num(state.settings.minProfitHour)) {
        decision = margin < num(state.settings.minNetMargin) ? "Raise Price" : "Stop";
      } else if (num(p.currentStock) <= trigger) {
        decision = "Restock";
      } else if (margin < num(state.settings.minNetMargin)) {
        decision = "Raise Price";
      }

      const noteMap = {
        Keep: "Healthy product. Monitor stock and margin weekly.",
        "Raise Price": "Profit/hour or margin is below target. Test a price increase.",
        Stop: "Labor or economics are weak. Consider discontinuing.",
        Restock: "Demand and stock level indicate reorder should be reviewed.",
        "Test More": "Sales/returns need more evidence before deciding."
      };

      const basePriority = { Stop: 500, "Raise Price": 400, Restock: 300, "Test More": 200, Keep: 0 }[decision] || 100;
      const priorityScore = decision === "Keep" ? 0 :
        basePriority
        + Math.max(0, num(state.settings.minProfitHour) - profitHour) * 5
        + Math.max(0, trigger - num(p.currentStock))
        + units / 1000
        + (index + 1) / 100000;

      return {
        ...p,
        unitsSold: units,
        avgDailySales,
        feesUnit: fee,
        variableCostUnit: cost,
        netProfitUnit,
        netMargin: margin,
        revenue,
        netProfitTotal,
        profitHour,
        currentStock: num(p.currentStock),
        returnRate: num(p.returnRate),
        decision,
        decisionNote: noteMap[decision],
        priorityScore
      };
    });
  }

  function calculateReorder(analysis = calculateAnalysis()) {
    return analysis.map((a) => {
      const leadTime = num(a.leadTimeDays);
      const z = num(a.serviceLevelZ) > 0 ? num(a.serviceLevelZ) : num(state.settings.defaultServiceZ);
      const safetyStock = z * num(a.demandStdDevDay) * Math.sqrt(Math.max(0, leadTime));
      const reorderPoint = a.avgDailySales * leadTime + safetyStock;
      const daysUntilStockout = a.avgDailySales > 0 ? a.currentStock / a.avgDailySales : null;
      const suggestedOrderQty = Math.max(0, Math.ceil(reorderPoint * 2 - a.currentStock));
      const action = a.currentStock <= reorderPoint ? "Order Now" : (a.currentStock <= reorderPoint * 1.25 ? "Watch" : "OK");
      return { ...a, safetyStock, reorderPoint, daysUntilStockout, suggestedOrderQty, action };
    });
  }

  function calculatePricing(analysis = calculateAnalysis()) {
    return analysis.map((a) => {
      const change = state.priceChanges[a.sku] ?? num(state.settings.defaultPriceIncrease);
      const newPrice = num(a.sellingPrice) * (1 + num(change));
      const newFees = feePerUnit(newPrice);
      const newNetProfitUnit = newPrice - newFees - (num(a.materialCost) + num(a.packagingCost) + num(a.shippingCost) + num(a.adSpendUnit) + num(a.returnRate) * newPrice);
      const newProfitHour = num(a.laborMinutes) > 0 ? newNetProfitUnit / (num(a.laborMinutes) / 60) : 0;
      const newMargin = newPrice > 0 ? newNetProfitUnit / newPrice : 0;
      let recommendation = "Increase more or reduce costs";
      if (newProfitHour >= num(state.settings.minProfitHour) && newMargin >= num(state.settings.minNetMargin)) recommendation = "Price test looks healthy";
      else if (newMargin < num(state.settings.minNetMargin)) recommendation = "Margin still weak";
      const notes = newProfitHour > a.profitHour ? "Improves profit/hour" : "Does not improve enough";
      return { ...a, priceChange: change, newPrice, newNetProfitUnit, newProfitHour, newMargin, recommendation, notes };
    });
  }

  function getSummary() {
    const analysis = calculateAnalysis();
    const reorder = calculateReorder(analysis);
    const productsCount = state.products.length;
    const totalUnits = sum(analysis, "unitsSold");
    const revenue = sum(analysis, "revenue");
    const netProfit = sum(analysis, "netProfitTotal");
    const profitHourAvg = avg(analysis.filter(x => x.profitHour > 0), "profitHour");
    const underTarget = analysis.filter((x) => x.profitHour > 0 && x.profitHour < num(state.settings.minProfitHour)).length;
    const actionCounts = countBy(analysis, "decision");
    const reorderCounts = countBy(reorder, "action");
    return { analysis, reorder, productsCount, totalUnits, revenue, netProfit, profitHourAvg, underTarget, actionCounts, reorderCounts };
  }

  function countBy(arr, key) {
    return arr.reduce((acc, x) => {
      const k = typeof key === "function" ? key(x) : x[key];
      acc[k] = (acc[k] || 0) + 1;
      return acc;
    }, {});
  }

  function groupBy(arr, key) {
    return arr.reduce((acc, x) => {
      const k = typeof key === "function" ? key(x) : x[key];
      (acc[k] ||= []).push(x);
      return acc;
    }, {});
  }

  function bindEvents() {
    setTheme();

    $("#loginForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.currentTarget);
      state.user = { email: String(fd.get("email") || "").trim() };
      state.workspace.name = String(fd.get("workspace") || "My Workspace").trim();
      state.workspace.licenseKey = String(fd.get("license") || "").trim();
      saveState();
      render();
      toast("Workspace opened.");
    });

    $$("[data-nav]").forEach(btn => btn.addEventListener("click", () => {
      state.ui.view = btn.dataset.nav;
      saveState();
      document.body.classList.remove("sidebar-open");
      render();
    }));

    $$("[data-ui]").forEach(input => input.addEventListener("input", () => {
      state.ui[input.dataset.ui] = input.value;
      saveState();
      render();
    }));

    $$("[data-product-index]").forEach(input => input.addEventListener("change", () => {
      const i = Number(input.dataset.productIndex);
      const field = input.dataset.field;
      if (!state.products[i]) return;
      state.products[i][field] = input.type === "number" ? num(input.value) : input.value;
      saveState();
      render();
    }));

    $$("[data-sale-index]").forEach(input => input.addEventListener("change", () => {
      const i = Number(input.dataset.saleIndex);
      const field = input.dataset.field;
      if (!state.sales[i]) return;
      state.sales[i][field] = input.type === "number" ? num(input.value) : input.value;
      saveState();
      render();
    }));

    $$("[data-setting]").forEach(input => input.addEventListener("change", () => {
      const key = input.dataset.setting;
      state.settings[key] = input.type === "number" ? num(input.value) : input.value.toUpperCase();
      saveState();
      render();
    }));

    $$("[data-price-sku]").forEach(input => input.addEventListener("change", () => {
      state.priceChanges[input.dataset.priceSku] = num(input.value);
      saveState();
      render();
    }));

    $$("[data-workspace]").forEach(input => input.addEventListener("change", () => {
      const key = input.dataset.workspace;
      if (key === "email") state.user = { ...(state.user || {}), email: input.value };
      else state.workspace[key] = input.value;
      saveState();
      render();
    }));

    $("#jsonImportInput")?.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        state = { ...defaultState(), ...data, ui: { ...defaultState().ui, ...(data.ui || {}), view: "dashboard" } };
        saveState();
        render();
        toast("JSON backup imported.");
      } catch (err) {
        toast("Invalid JSON backup.");
      }
    });

    $$("[data-action]").forEach(btn => btn.addEventListener("click", handleAction));
  }

  function handleAction(e) {
    const action = e.currentTarget.dataset.action;
    if (action === "toggleSidebar") document.body.classList.toggle("sidebar-open");
    if (action === "themeToggle") {
      state.ui.theme = state.ui.theme === "light" ? "dark" : "light";
      saveState(); render();
    }
    if (action === "logout") {
      state.user = null; saveState(); render();
    }
    if (action === "addProduct") addProduct();
    if (action === "deleteProduct") deleteProduct(Number(e.currentTarget.dataset.index));
    if (action === "addSale") addSale();
    if (action === "deleteSale") deleteSale(Number(e.currentTarget.dataset.index));
    if (action === "importSalesCsv") importSalesCsv();
    if (action === "exportProductsCsv") exportProductsCsv();
    if (action === "exportSalesCsv") exportSalesCsv();
    if (action === "exportAnalysisCsv") exportAnalysisCsv();
    if (action === "exportReorderCsv") exportReorderCsv();
    if (action === "exportPricingCsv") exportPricingCsv();
    if (action === "exportWeeklyCsv") exportWeeklyCsv();
    if (action === "copyWeekly") copyWeekly();
    if (action === "resetSettings") { state.settings = structuredClone(DEFAULT_SETTINGS); saveState(); render(); toast("Settings reset."); }
    if (action === "saveSettings") { saveState(); toast("Settings saved."); }
    if (action === "downloadJson") downloadJson();
    if (action === "resetSample" || action === "resetSampleBeforeLogin") resetSample(action === "resetSampleBeforeLogin");
    if (action === "clearAll") clearAll();
    if (action === "saveMember") { saveState(); toast("Member details saved."); }
    if (action === "upgradeNotice") { toast("Connect Supabase Auth first, then this button will call create-checkout."); }
    if (action === "simulateFull") { state.workspace.plan = "Full"; state.workspace.subscriptionStatus = "Active"; saveState(); render(); toast("Full access simulated."); }
    if (action === "simulatePastDue") { state.workspace.subscriptionStatus = "Past due"; saveState(); render(); toast("Past due status simulated."); }
  }

  function addProduct() {
    if (state.workspace.plan !== "Full" && state.products.length >= FREE_PRODUCT_LIMIT) {
      state.ui.view = "member";
      saveState();
      render();
      toast("Free Starter supports up to 3 products. Upgrade to Full Planner for unlimited products.");
      return;
    }
    const id = `SKU-${String(state.products.length + 1).padStart(3, "0")}`;
    state.products.push({
      id, sku: id, name: "New Product", category: "New Category", variant: "Default",
      sellingPrice: 25, materialCost: 5, packagingCost: 1, shippingCost: 3,
      laborMinutes: 30, currentStock: 10, leadTimeDays: 10, serviceLevelZ: num(state.settings.defaultServiceZ),
      demandStdDevDay: 1, returnRate: 0.03, adSpendUnit: 1, targetHourlyWage: num(state.settings.minProfitHour), notes: ""
    });
    saveState(); render(); toast("Product added.");
  }

  function deleteProduct(index) {
    const sku = state.products[index]?.sku;
    state.products.splice(index, 1);
    if (sku) delete state.priceChanges[sku];
    saveState(); render(); toast("Product deleted.");
  }

  function addSale() {
    const sku = $("#newSaleSku")?.value || state.products[0]?.sku || "";
    const product = state.products.find(p => p.sku === sku);
    const units = num($("#newSaleUnits")?.value, 1);
    const revenueInput = num($("#newSaleRevenue")?.value, 0);
    state.sales.unshift({
      date: $("#newSaleDate")?.value || todayIso(),
      sku,
      unitsSold: units,
      revenue: revenueInput > 0 ? revenueInput : units * num(product?.sellingPrice),
      refunds: num($("#newSaleRefunds")?.value),
      adSpend: num($("#newSaleAd")?.value),
      channel: $("#newSaleChannel")?.value || "Etsy",
      notes: $("#newSaleNotes")?.value || ""
    });
    saveState(); render(); toast("Sale added.");
  }

  function deleteSale(index) {
    state.sales.splice(index, 1);
    saveState(); render(); toast("Sale deleted.");
  }

  function resetSample(keepLogin = false) {
    const previousUser = state.user;
    state = defaultState();
    if (keepLogin) state.user = previousUser;
    saveState();
    render();
    toast("Sample data reloaded.");
  }

  function clearAll() {
    if (!confirm("Clear all products, sales and settings?")) return;
    const user = state.user;
    const workspace = state.workspace;
    state = defaultState();
    state.user = user;
    state.workspace = workspace;
    state.products = [];
    state.sales = [];
    saveState();
    render();
    toast("All model data cleared.");
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", quote = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i + 1];
      if (c === '"' && quote && n === '"') { cell += '"'; i++; }
      else if (c === '"') quote = !quote;
      else if (c === "," && !quote) { row.push(cell.trim()); cell = ""; }
      else if ((c === "\n" || c === "\r") && !quote) {
        if (cell || row.length) { row.push(cell.trim()); rows.push(row); row = []; cell = ""; }
        if (c === "\r" && n === "\n") i++;
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
    return rows.filter(r => r.some(c => c !== ""));
  }

  function normalizeHeader(h) {
    return String(h).toLowerCase().replace(/[^a-z0-9]/g, "");
  }

  function importSalesCsv() {
    const text = $("#salesCsvPaste")?.value || "";
    const rows = parseCsv(text);
    if (rows.length < 2) return toast("Paste CSV with headers first.");
    const headers = rows[0].map(normalizeHeader);
    const index = (names) => names.map(normalizeHeader).map(n => headers.indexOf(n)).find(i => i >= 0);
    const map = {
      date: index(["date"]),
      sku: index(["sku"]),
      unitsSold: index(["units sold", "units", "quantity"]),
      revenue: index(["revenue", "gross sales", "sales"]),
      refunds: index(["refunds", "refund"]),
      adSpend: index(["ad spend", "ads", "marketing"]),
      channel: index(["channel", "marketplace"]),
      notes: index(["notes", "note"])
    };
    const newRows = rows.slice(1).map(r => ({
      date: r[map.date] || todayIso(),
      sku: r[map.sku] || "",
      unitsSold: num(r[map.unitsSold]),
      revenue: num(r[map.revenue]),
      refunds: num(r[map.refunds]),
      adSpend: num(r[map.adSpend]),
      channel: r[map.channel] || "Imported",
      notes: r[map.notes] || "CSV import"
    })).filter(r => r.sku && r.unitsSold > 0);
    state.sales = [...newRows, ...state.sales];
    saveState(); render(); toast(`${newRows.length} sales rows imported.`);
  }

  function toCsv(rows) {
    if (!rows.length) return "";
    const headers = Object.keys(rows[0]);
    const esc = (v) => {
      const s = String(v ?? "");
      return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    return [headers.join(","), ...rows.map(r => headers.map(h => esc(r[h])).join(","))].join("\n");
  }

  function download(filename, content, type = "text/csv") {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    a.remove(); URL.revokeObjectURL(url);
  }

  function exportProductsCsv() {
    download("mavenory-products.csv", toCsv(state.products));
  }

  function exportSalesCsv() {
    download("mavenory-sales.csv", toCsv(state.sales));
  }

  function exportAnalysisCsv() {
    const rows = calculateAnalysis().map(({id, priorityScore, decisionNote, ...r}) => r);
    download("mavenory-product-analysis.csv", toCsv(rows));
  }

  function exportReorderCsv() {
    const rows = calculateReorder().map(r => ({
      sku: r.sku, product: r.name, avgDailySales: r.avgDailySales, leadTimeDays: r.leadTimeDays,
      safetyStock: r.safetyStock, reorderPoint: r.reorderPoint, currentStock: r.currentStock,
      daysUntilStockout: r.daysUntilStockout, suggestedOrderQty: r.suggestedOrderQty, action: r.action
    }));
    download("mavenory-reorder-planner.csv", toCsv(rows));
  }

  function exportPricingCsv() {
    const rows = calculatePricing().map(r => ({
      sku: r.sku, product: r.name, currentPrice: r.sellingPrice, priceChange: r.priceChange,
      newPrice: r.newPrice, currentProfitHour: r.profitHour, newNetProfitUnit: r.newNetProfitUnit,
      newProfitHour: r.newProfitHour, newMargin: r.newMargin, recommendation: r.recommendation, notes: r.notes
    }));
    download("mavenory-pricing-simulator.csv", toCsv(rows));
  }

  function exportWeeklyCsv() {
    const rows = calculateAnalysis()
      .filter(x => x.priorityScore > 0)
      .sort((a,b) => b.priorityScore - a.priorityScore)
      .slice(0, 10)
      .map((r, i) => ({ priority: i + 1, action: r.decision, sku: r.sku, product: r.name, reason: r.decisionNote, done: "" }));
    download("mavenory-weekly-checklist.csv", toCsv(rows));
  }

  function downloadJson() {
    download("mavenory-webapp-backup.json", JSON.stringify(state, null, 2), "application/json");
  }

  async function copyWeekly() {
    const text = $("#weeklySummary")?.textContent || "";
    try {
      await navigator.clipboard.writeText(text);
      toast("Weekly summary copied.");
    } catch {
      toast("Copy failed. Select the text manually.");
    }
  }

  function render() {
    setTheme();
    $("#app").innerHTML = state.user ? renderLayout() : renderAuth();
    bindEvents();
  }

  render();
})();

  </script>
</body>
</html>
